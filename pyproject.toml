[project]
name = "kernelguard"
version = "0.0.1"
description = "Representation-aware runtime guardrail research instrument"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.45",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kernelguard*"]

[tool.uv]
# CUDA 12.6 torch for the GPU host (driver 570). The CPU dev container uses https://download.pytorch.org/whl/cpu.
index = [{ name = "pytorch-cu126", url = "https://download.pytorch.org/whl/cu126", explicit = true }]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
